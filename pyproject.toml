[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-canary"
version = "0.1.0"
description = "Canary tokens for RAG corpora: plant fake secrets in your documents so exfiltration via prompt injection trips the wire. Detection, not prevention."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anusha Mukka" }]
keywords = ["rag", "retrieval-augmented-generation", "security", "canary", "prompt-injection", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
rag-canary = "rag_canary.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/anushamukka9/rag-canary"
Issues = "https://github.com/anushamukka9/rag-canary/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_canary"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
